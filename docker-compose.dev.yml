version: '3.8'

services:
  opencode-dev:
    image: oven/bun:1.1.34
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4096:4096"  # API Server
      - "3001:3001"  # UI/App
    command: bash -c "cd /app/packages/opencode && bun run dev"
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
