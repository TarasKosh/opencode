version: '3.8'

services:
  opencode-solopreneur:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4096:4096"  # API Server
      - "3001:3001"  # UI/App (if running)
    command: bash -c "bun install --verbose && bun dev"
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
